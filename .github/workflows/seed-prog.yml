name: Seed progressivo (+50)
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Publicar lote do dia
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IMG_BASE: ${{ secrets.IMG_BASE }}
          LIMIT: "13"
        run: node scripts/seed-batch.js 2>&1 | tee saida.log
      - name: Desligar quando o pool acabar
        run: |
          CAND=$(grep -oE '(candidatos|candidates): [0-9]+' saida.log | grep -oE '[0-9]+' | head -1 || true)
          PUB=$(grep -oE '=== [0-9]+ (artigos publicados|articles published)' saida.log | grep -oE '[0-9]+' | head -1 || true)
          echo "candidatos=$CAND publicados=$PUB"
          if [ "$CAND" = "0" ]; then
            curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/seed-prog.yml/disable"
            echo "Pool esgotado — seed progressivo desligado sozinho. ✅"
          fi
